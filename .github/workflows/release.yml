name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string
        default: 'main'
      version:
        description: 'Version to release (e.g., 0.10.0-rc.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  R2_BUCKET: agentstash-releases
  R2_ENDPOINT: https://4ebddd5e5e333cde8ec99cb72932baba.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://releases.agentstash.dev

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    runs-on: self-hosted
    steps:
      - name: Get build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ianchenx/agentstash
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}

      - name: Configure updater endpoint for RC
        run: |
          jq '.plugins.updater.endpoints = ["${{ env.R2_PUBLIC_URL }}/rc/latest.json"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup isolated Rust env
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> $GITHUB_ENV
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TERM_QUIET: "true"
        with:
          tagName: v${{ steps.params.outputs.version }}
          releaseName: 'AgentStash v${{ steps.params.outputs.version }} (RC)'
          releaseBody: 'Release Candidate - for testing only'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config '{"version":"${{ steps.params.outputs.version }}"}'

  sync-to-r2:
    needs: build-macos
    runs-on: self-hosted
    steps:
      - name: Get version
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish release and sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.params.outputs.version }}"
          
          # Publish the draft release first
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/${RELEASE_ID} -X PATCH -f draft=false
            echo "Published release v${VERSION}"
          fi
          
          # Download all release assets
          mkdir -p assets
          gh release download "v${VERSION}" --dir assets --repo ${{ github.repository }}
          
          # Upload all assets to R2
          for file in assets/*; do
            FILENAME=$(basename "$file")
            aws s3 cp "$file" "s3://${{ env.R2_BUCKET }}/rc/v${VERSION}/${FILENAME}" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
            echo "Uploaded: $FILENAME"
          done
          
          # Upload latest.json (version already correct from --version flag)
          if [ -f "assets/latest.json" ]; then
            # Replace GitHub URLs with R2 URLs
            sed -i "s|https://github.com/.*/releases/download/v${VERSION}/|${{ env.R2_PUBLIC_URL }}/rc/v${VERSION}/|g" assets/latest.json
            
            aws s3 cp assets/latest.json "s3://${{ env.R2_BUCKET }}/rc/latest.json" \
              --endpoint-url "${{ env.R2_ENDPOINT }}" \
              --content-type "application/json"
            echo "Uploaded latest.json with R2 URLs"
          fi
