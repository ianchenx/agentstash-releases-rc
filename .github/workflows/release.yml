name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string
        default: 'main'
      version:
        description: 'Version to release (e.g., 0.10.0-rc.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  R2_BUCKET: agentstash-releases
  R2_ENDPOINT: https://4ebddd5e5e333cde8ec99cb72932baba.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://releases.agentstash.dev

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    runs-on: macos-latest
    steps:
      - name: Get build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ianchenx/agentstash
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}

      - name: Configure updater endpoint for RC
        run: |
          jq '.plugins.updater.endpoints = ["${{ env.R2_PUBLIC_URL }}/rc/latest.json"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TERM_QUIET: "true"
        with:
          tagName: v${{ steps.params.outputs.version }}
          releaseName: 'AgentStash v${{ steps.params.outputs.version }} (RC)'
          releaseBody: 'Release Candidate - for testing only'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          VERSION="${{ steps.params.outputs.version }}"
          TARGET="${{ matrix.target }}"
          
          # Find build artifacts
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          
          # Upload .dmg
          for dmg in ${BUNDLE_DIR}/dmg/*.dmg; do
            if [ -f "$dmg" ]; then
              FILENAME=$(basename "$dmg")
              aws s3 cp "$dmg" "s3://${{ env.R2_BUCKET }}/rc/v${VERSION}/${FILENAME}" \
                --endpoint-url "${{ env.R2_ENDPOINT }}"
              echo "Uploaded: $FILENAME"
            fi
          done
          
          # Upload .app.tar.gz and .app.tar.gz.sig (for updater)
          for tarball in ${BUNDLE_DIR}/macos/*.tar.gz*; do
            if [ -f "$tarball" ]; then
              FILENAME=$(basename "$tarball")
              aws s3 cp "$tarball" "s3://${{ env.R2_BUCKET }}/rc/v${VERSION}/${FILENAME}" \
                --endpoint-url "${{ env.R2_ENDPOINT }}"
              echo "Uploaded: $FILENAME"
            fi
          done

      - name: Upload artifact info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*

  publish-release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate and upload latest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          VERSION="${{ steps.params.outputs.version }}"
          BASE_URL="${{ env.R2_PUBLIC_URL }}/rc/v${VERSION}"
          
          # Find the signature files
          AARCH64_SIG=$(find artifacts -name "*aarch64*.tar.gz.sig" -type f 2>/dev/null | head -1)
          X86_64_SIG=$(find artifacts -name "*x86_64*.tar.gz.sig" -type f 2>/dev/null | head -1)
          
          # Read signatures (base64 encoded)
          AARCH64_SIGNATURE=""
          X86_64_SIGNATURE=""
          
          if [ -f "$AARCH64_SIG" ]; then
            AARCH64_SIGNATURE=$(cat "$AARCH64_SIG")
          fi
          if [ -f "$X86_64_SIG" ]; then
            X86_64_SIGNATURE=$(cat "$X86_64_SIG")
          fi
          
          # Generate latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release Candidate v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/AgentStash.app.tar.gz",
                "signature": "${AARCH64_SIGNATURE}"
              },
              "darwin-x86_64": {
                "url": "${BASE_URL}/AgentStash_x64.app.tar.gz",
                "signature": "${X86_64_SIGNATURE}"
              }
            }
          }
          EOF
          
          cat latest.json
          
          # Upload latest.json to R2
          aws s3 cp latest.json "s3://${{ env.R2_BUCKET }}/rc/latest.json" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --content-type "application/json"
          
          echo "Uploaded latest.json to R2"

      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const draft = releases.data.find(r => r.draft && r.tag_name === 'v${{ steps.params.outputs.version }}');
            
            if (draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                draft: false
              });
              console.log('RC Release published!');
            } else {
              console.log('No draft release found');
            }
